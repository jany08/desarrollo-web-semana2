<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DAW UEA{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <!-- base.html: plantilla principal que conserva encabezado y menú común -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('inicio') }}">DAW UEA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link {% if active == 'inicio' %}active{% endif %}" href="{{ url_for('inicio') }}">Inicio</a></li>
          <li class="nav-item"><a class="nav-link {% if active == 'rutas' %}active{% endif %}" href="{{ url_for('rutas') }}">Rutas</a></li>
          <li class="nav-item"><a class="nav-link {% if active == 'participantes' %}active{% endif %}" href="{{ url_for('participantes') }}">Participantes</a></li>
          <li class="nav-item"><a class="nav-link {% if active == 'recursos' %}active{% endif %}" href="{{ url_for('recursos') }}">Recursos</a></li>
          <li class="nav-item"><a class="nav-link {% if active == 'solicitudes' %}active{% endif %}" href="{{ url_for('solicitudes') }}">Solicitudes</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- bloque reutilizable para el contenido principal de cada vista -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- base.html: pie de página común para todas las vistas internas -->
  <footer class="footer">
    <div class="container d-flex justify-content-between flex-wrap gap-2">
      <span>DAW UEA</span>
      <small>Proyecto Integrador U3 · Avance 9/16</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
